name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python bike_forecast.py --output reports
      - run: python -c "import nbformat; from nbclient import NotebookClient; NotebookClient(nbformat.read('bike_forecast.ipynb', as_version=4), timeout=120).execute()"
